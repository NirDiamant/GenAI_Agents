# Smoke check for every notebook and script: does the code still parse?
# It loads each .ipynb with nbformat, drops IPython magics and shell lines
# (% and !), joins the code cells in order and compiles them, then
# py_compiles every .py file. It needs no API keys and runs nothing.
name: notebook-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbformat
        run: python -m pip install --quiet nbformat

      - name: Compile notebook code cells
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          import nbformat

          failures = []
          notebooks = sorted(p for p in pathlib.Path(".").rglob("*.ipynb") if ".git" not in p.parts)
          for path in notebooks:
              try:
                  nb = nbformat.read(path, as_version=4)
              except Exception as exc:
                  failures.append(f"{path}: cannot be read by nbformat: {exc}")
                  continue
              chunks = []
              for cell in nb.cells:
                  if cell.cell_type != "code":
                      continue
                  lines = cell.source.splitlines()
                  if lines and lines[0].lstrip().startswith("%%"):
                      magic = lines[0].lstrip()[2:].split()[0] if lines[0].lstrip()[2:].split() else ""
                      if magic not in {"capture", "time", "timeit", "prun"}:
                          continue  # e.g. %%bash or %%writefile: the body is not Python
                      lines = lines[1:]  # these magics wrap ordinary Python, so check the body
                  kept = []
                  for line in lines:
                      stripped = line.lstrip()
                      if stripped.startswith(("%", "!")):
                          # keep the block structure valid if the magic was indented
                          kept.append(line[: len(line) - len(stripped)] + "pass")
                      else:
                          kept.append(line)
                  chunks.append("\n".join(kept))
              source = "\n\n".join(chunks) + "\n"
              try:
                  compile(source, f"<{path}>", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT, dont_inherit=True)
              except SyntaxError as exc:
                  failures.append(f"{path}: {exc.msg} (joined line {exc.lineno}): {(exc.text or '').strip()}")
          print(f"Checked {len(notebooks)} notebooks.")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Compile Python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          failures = []
          files = sorted(p for p in pathlib.Path(".").rglob("*.py") if ".git" not in p.parts)
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append(str(exc))
          print(f"Checked {len(files)} Python files.")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY
